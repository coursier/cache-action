name: 'coursier-cache-action'
description: 'Save and restore the coursier, sbt and mill caches of Scala builds'
author: 'Alexandre Archambault'
branding:
  icon: 'arrow-down'
  color: 'white'
# See the README for more details about each input:
# https://github.com/coursier/cache-action#inputs
inputs:
  root:
    required: false
    description: >
      Directory containing the build definition (build.sbt, build.mill, etc.), relative to the
      repository root. Set it if your build is in a sub-directory.
    default: '.'
  path:
    required: false
    description: >
      Path of the coursier cache. Defaults to the directory the COURSIER_CACHE environment
      variable points to, if it is set, else to the default OS-dependent location. When set,
      COURSIER_CACHE is also set to this path for the subsequent steps.
    default: ''
  extraFiles:
    required: false
    description: >
      Extra files to take into account in the keys of all caches, in addition to the sbt and mill
      build files. Either a single path or glob, or a JSON array of paths or globs, like
      '["dependencies.json", "scripts/*.sh"]'. Paths are relative to the repository root.
      Entries of the .github/cs-cache-files file, if it exists, are added to these
      (see read-cs-cache-files).
    default: ''
  extraSbtFiles:
    required: false
    description: >
      Extra sbt build files, same format as extraFiles. They are taken into account in the sbt and
      coursier cache keys, and finding any of them enables the sbt cache.
    default: ''
  extraMillFiles:
    required: false
    description: >
      Extra mill build files, same format as extraFiles. They are taken into account in the mill
      and coursier cache keys, and finding any of them enables the mill cache.
    default: ''
  extraKey:
    required: false
    description: >
      Extra value added as is to the keys of all caches. For values you'd rather have hashed, use
      extraHashedContent.
    default: ''
  extraCoursierKey:
    required: false
    description: >
      Same as extraKey, but only added to the coursier cache key.
    default: ''
  extraSbtKey:
    required: false
    description: >
      Same as extraKey, but only added to the sbt cache key.
    default: ''
  extraMillKey:
    required: false
    description: >
      Same as extraKey, but only added to the mill cache key.
    default: ''
  extraHashedContent:
    required: false
    description: >
      Extra content to take into account in the keys of all caches. It is hashed along with the
      build files.
    default: ''
  extraCoursierHashedContent:
    required: false
    description: >
      Same as extraHashedContent, but only taken into account in the coursier cache key.
    default: ''
  extraSbtHashedContent:
    required: false
    description: >
      Same as extraHashedContent, but only taken into account in the sbt and coursier cache keys.
    default: ''
  extraMillHashedContent:
    required: false
    description: >
      Same as extraHashedContent, but only taken into account in the mill and coursier cache keys.
    default: ''
  read-cs-cache-files:
    required: false
    description: >
      Set to 'false' to ignore the .github/cs-cache-files file. When that file exists, each of its
      lines is a path or glob added to extraFiles.
    default: 'true'
  job:
    required: false
    description: >
      Job name, added to the cache keys, so that each job has its own caches. Defaults to the id of
      the current job.
    default: '${{ github.job }}'
  matrix:
    required: false
    description: >
      Matrix values, hashed and added to the cache keys, so that each instance of a matrix job has
      its own caches. Defaults to the matrix values of the current job, so that you don't need to
      set it in most cases.
    default: '${{ toJson(matrix) }}'
  ignoreJob:
    required: false
    description: >
      Set to 'true' to leave the job name out of the cache keys, so that different jobs share
      their caches.
    default: 'false'
  ignoreMatrix:
    required: false
    description: >
      Set to 'true' to leave the matrix values out of the cache keys, so that the instances of a
      matrix job share their caches.
    default: 'false'
  disableFallback:
    required: false
    description: >
      Set to 'true' to only restore caches whose key matches exactly. By default, when there's no
      exact match, the closest cache is restored, which can come from another job or matrix
      instance.
    default: 'false'
  cacheMode:
    required: false
    description: >
      Cache access for this step, one of 'read', 'write', 'write-only', or 'none'. This can only
      narrow the access granted by the workflow or job 'cache-mode' key, never widen it. For example,
      pass 'read' to restore caches without saving them. Leave empty to use the workflow or job
      cache-mode as is.
    default: ''
  ammoniteScripts:
    required: false
    description: >
      Deprecated, as Ammonite support is. Extra Ammonite scripts, same format as extraFiles.
    default: ''
  extraAmmoniteKey:
    required: false
    description: >
      Deprecated, as Ammonite support is. Same as extraKey, but only added to the Ammonite cache
      key.
    default: ''
  extraAmmoniteHashedContent:
    required: false
    description: >
      Deprecated, as Ammonite support is. Same as extraHashedContent, but only taken into account
      in the Ammonite and coursier cache keys.
    default: ''
  ignoreAmmonite:
    required: false
    description: >
      Deprecated, as Ammonite support is. Set to 'true' to never save or restore the Ammonite
      cache (~/.ammonite), even if the repository contains *.sc files.
    default: 'false'
outputs:
  cache-hit-coursier:
    description: "'true' if the coursier cache was restored from an exact key match"
  cache-hit-sbt-ivy2-cache:
    description: "'true' if the sbt cache (~/.sbt and ~/.ivy2/cache) was restored from an exact key match"
  cache-hit-mill:
    description: "'true' if the mill cache was restored from an exact key match"
  cache-hit-ammonite:
    description: "Deprecated, as Ammonite support is. 'true' if the Ammonite cache was restored from an exact key match"
runs:
  using: 'node24'
  main: 'dist/restore/index.js'
  post: 'dist/save/index.js'
  post-if: 'success()'
