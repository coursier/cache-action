version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    # Look for `package.json` and `lock` files in the `root` directory
    directory: '/'
    # Check the npm registry for updates every day (weekdays)
    schedule:
      interval: 'daily'
    ignore:
      # 'typescript' is an alias of @typescript/typescript6: TypeScript 7 has no
      # JS compiler API yet, which typescript-eslint and ncc's ts-loader both
      # need. TS 7's tsc comes from '@typescript/native'. Drop the alias and
      # this rule once both tools support TS 7.1's API.
      - dependency-name: 'typescript'
        versions: ['>=7']
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
